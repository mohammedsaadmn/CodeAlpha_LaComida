<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | La comida</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./hotel.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-warning">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="index.html">
                🍴 La comida
            </a>
        </div>
    </nav>


    <!-- REGISTER -->
    <div class="auth-container">

        <div class="auth-card">

            <div class="text-center mb-4">
                <div class="auth-icon">👤</div>

                <h2 class="fw-bold">Create Account</h2>

                <p class="text-muted">
                    Join La comida today
                </p>
            </div>


            <form id="registerForm">

                <div class="mb-3">
                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        class="form-control"
                        placeholder="Enter your name"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <div class="mb-4">
                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-warning w-100 fw-bold"
                >
                    Create Account
                </button>

            </form>


            <div class="text-center mt-4">

                <span class="text-muted">
                    Already have an account?
                </span>

                <a href="login.html" class="fw-bold text-warning">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="./auth.js"></script>

</body>
</html>
