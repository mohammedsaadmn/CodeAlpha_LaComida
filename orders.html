<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - La comida</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar-custom {
            background: #ffa500;
            padding: 15px 25px;
        }

        .brand {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

        .orders-container {
            max-width: 1000px;
            margin: 110px auto 40px;
        }

        .order-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-id {
            color: #555;
            font-size: 14px;
        }

        .status {
            background: #fff3cd;
            color: #856404;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .order-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .empty-orders {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
        }

        .back-btn {
            background: #ffc107;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            color: #000;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar-custom fixed-top shadow-sm">

        <a href="index.html" class="brand">
            🍽️ La comida
        </a>

    </nav>


    <!-- ORDERS -->

    <div class="container orders-container">

        <h1 class="text-center fw-bold mb-4">
            📦 My Orders
        </h1>

        <div id="ordersContainer"></div>

    </div>


    <script src="orders.js"></script>

</body>
</html>
