<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - La comida</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

            /* ===============================
   PAYMENT OPTIONS
   =============================== */

.payment-option {
    display: block;
    border: 1px solid #dee2e6;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: #fff;
}

.payment-option:hover {
    border-color: #ffc107;
    background: #fffdf5;
}

.payment-option:has(input:checked) {
    border: 2px solid #ffc107;
    background: #fffaf0;
}

.payment-content {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-left: 8px;
}

.payment-icon {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f9fa;
    border-radius: 10px;
    font-size: 22px;
}

.payment-content strong {
    display: block;
    font-size: 16px;
}

.payment-content small {
    display: block;
    color: #6c757d;
    margin-top: 3px;
}


/* ===============================
   UPI PAYMENT BOX
   =============================== */

.upi-payment-box {
    margin-top: 15px;
    padding: 22px;
    border: 1px solid #ffc107;
    border-radius: 14px;
    background: #fffdf5;
}

.upi-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
}

.upi-header h5 {
    font-weight: bold;
    margin-bottom: 4px;
}

.upi-header p {
    margin: 0;
    color: #6c757d;
}

.upi-secure {
    background: #e8f5e9;
    color: #198754;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}


/* ===============================
   QR CODE
   =============================== */

.qr-container {
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #dee2e6;
    width: 180px;
    height: 180px;
    margin: auto;
}

#upiQrCode img {
    max-width: 150px;
    max-height: 150px;
}


/* ===============================
   UPI AMOUNT
   =============================== */

.upi-amount {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 12px 15px;
}

.upi-amount strong {
    font-size: 20px;
}


/* ===============================
   PAYMENT STATUS
   =============================== */

.payment-status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.payment-success {
    background: #d1e7dd;
    color: #0f5132;
}

.payment-error {
    background: #f8d7da;
    color: #842029;
}  
                body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .checkout-navbar {
            background: #ffa500;
            padding: 15px 25px;
        }
        body {
    padding-top: 70px;
}

        .brand {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

       .checkout-container {
    max-width: 700px;
    width: 100%;
    margin: 50px auto;
    padding: 0 15px;
}

.checkout-container .row {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
}

.checkout-container .col-lg-7,
.checkout-container .col-lg-5 {
    width: 100%;
    max-width: 700px;
    padding: 0;
}
        .checkout-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .order-item {
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .total-box {
            background: #fff8dc;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .place-order-btn {
            width: 100%;
            background: #ffc107;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
        }

        .place-order-btn:hover {
            background: #ffb300;
        }



    </style>
</head>
<body>
     <!-- NAVBAR -->
    <nav class="checkout-navbar fixed-top shadow-sm">
        <a href="index.html" class="brand">
            🍽️ La comida
        </a>
    </nav>

     <!-- CHECKOUT -->
    <div class="container checkout-container">

        <h1 class="text-center fw-bold mb-4">
            🛒 Checkout
        </h1>

        <div class="row g-4">

     <!-- CUSTOMER INFORMATION -->
            <div class="col-lg-7">

                <div class="checkout-card">

                    <h3 class="section-title">
                        📍 Delivery Information
                    </h3>

                    <form id="checkoutForm">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="customerName"
                                class="form-control"
                                placeholder="Enter your full name"
                                required
                            >
                        </div>
         <div class="mb-3">
                            <label class="form-label fw-bold">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                class="form-control"
                                placeholder="Enter your phone number"
                                required
                            >
                        </div>

                   <div class="mb-3">
                            <label class="form-label fw-bold">
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                class="form-control"
                                rows="4"
                                placeholder="Enter your complete delivery address"
                                required
                            ></textarea>
                        </div>    
                        
           <div class="mb-3">
                            <label class="form-label fw-bold">
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                class="form-control"
                                placeholder="Enter your city"
                                required
                            >
                        </div> 
                        
                                  <!-- PAYMENT METHOD -->
<div class="payment-section mt-4">

    <h4 class="section-title">
        💳 Payment Method
    </h4>

    <!-- COD -->
    <label class="payment-option" for="cod">

        <input
            class="form-check-input"
            type="radio"
            name="payment"
            id="cod"
            value="Cash on Delivery"
            checked
        >

        <div class="payment-content">
            <div class="payment-icon">💵</div>

            <div>
                <strong>Cash on Delivery</strong>
                <small>
                    Pay when your order arrives
                </small>
            </div>
        </div>

    </label>


    <!-- UPI -->
    <label class="payment-option" for="upi">

        <input
            class="form-check-input"
            type="radio"
            name="payment"
            id="upi"
            value="UPI"
        >

        <div class="payment-content">

            <div class="payment-icon">📱</div>

            <div>
                <strong>UPI Payment</strong>
                <small>
                    Google Pay • PhonePe • Paytm • BHIM
                </small>
            </div>

        </div>

    </label>


    <!-- UPI PAYMENT PANEL -->
    <div
        id="upiPaymentBox"
        class="upi-payment-box d-none"
    >

        <div class="upi-header">

            <div>
                <h5>📱 Pay securely with UPI</h5>

                <p>
                    Scan the QR code or enter your UPI ID
                </p>
            </div>

            <span class="upi-secure">
                🔒 Secure
            </span>

        </div>


        <div class="row align-items-center">

            <!-- QR -->
            <div class="col-md-5 text-center">

                <div class="qr-container">

                    <div id="upiQrCode"></div>

                </div>

                <small class="text-muted">
                    Scan with any UPI app
                </small>

            </div>


            <!-- UPI DETAILS -->
            <div class="col-md-7">

                <label
                    for="upiId"
                    class="form-label fw-bold"
                >
                    UPI ID
                </label>

                <input
                    type="text"
                    id="upiId"
                    class="form-control form-control-lg"
                    placeholder="yourname@upi"
                >

                <small class="text-muted">
                    
                </small>


                <div class="upi-amount mt-3">

                    <span>Amount to Pay</span>

                    <strong id="upiAmount">
                        ₹0.00
                    </strong>

                </div>


                <button
                    type="button"
                    id="upiPayButton"
                    class="btn btn-success w-100 mt-3"
                >
                    🔐 Pay with UPI
                </button>

            </div>

        </div>


        <div
            id="upiPaymentStatus"
            class="payment-status d-none"
        >
        </div>

    </div>

</div>
                        
<br>

            <!-- ORDER SUMMARY -->
            <div class="col-lg-5">

                <div class="checkout-card">

                    <h3 class="section-title">
                        📦 Order Summary
                    </h3>

                    <div id="orderSummary"></div>

                    <div class="total-box">

                        <div class="d-flex justify-content-between">
                            <span>Subtotal</span>
                            <strong id="subtotal">
                                ₹0.00
                            </strong>
                        </div>

                        <div class="d-flex justify-content-between mt-2">
                            <span>Delivery Fee</span>
                            <strong id="deliveryFee">
                                ₹40.00
                            </strong>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <h4>Total</h4>

                            <h4 id="grandTotal">
                                ₹0.00
                            </h4>
                        </div>

                    </div>


                    <button
                        type="submit"
                        form="checkoutForm"
                        class="place-order-btn mt-3"
                    >
                        🛍️ Place Order
                    </button>

                </div>

            </div>

        </div>

    </div>


    
 <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="./checkout.js"></script>

<script>
    const codRadio = document.getElementById("cod");
    const upiRadio = document.getElementById("upi");
    const upiPaymentBox = document.getElementById("upiPaymentBox");

    function updatePaymentMethod() {
        if (upiRadio.checked) {
            upiPaymentBox.classList.remove("d-none");
        } else {
            upiPaymentBox.classList.add("d-none");
        }
    }

    codRadio.addEventListener("change", updatePaymentMethod);
    upiRadio.addEventListener("change", updatePaymentMethod);
</script>
            
</body>
</html>
