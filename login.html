<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | La comida</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./hotel.css">

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-warning">

        <div class="container">

            <a
                class="navbar-brand fw-bold text-dark"
                href="index.html"
            >
                🍴 La comida
            </a>

        </div>

    </nav>



    <!-- LOGIN -->

    <div class="auth-container">

        <div class="auth-card">


            <div class="text-center mb-4">

                <div class="auth-icon">
                    🔐
                </div>

                <h2 class="fw-bold">
                    Welcome Back
                </h2>

                <p class="text-muted">
                    Login to your La comida account
                </p>

            </div>



            <form id="loginForm">


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="btn btn-warning w-100 fw-bold"
                >
                    Login
                </button>


            </form>



          <div class="text-center mt-4">

                <span class="text-muted">
                    Don't have an account?
                </span>

                <a
                    href="register.html"
                    class="fw-bold text-warning"
                >
                    Create Account
                </a>

            </div>


        </div>

    </div>


    <script src="./auth.js"></script>

</body>
</html>
